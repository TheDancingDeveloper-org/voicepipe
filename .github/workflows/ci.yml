name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a new RustSec advisory against the locked tree is noticed
    # without waiting for a change.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: [self-hosted]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: cargo test, no default features
        run: cargo test --locked --no-default-features

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

      - name: cargo publish --dry-run
        run: cargo publish --locked --dry-run

  msrv:
    runs-on: [self-hosted]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Keep in step with `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: cargo test on the declared minimum Rust
        run: cargo test --locked --all-features

  audit:
    runs-on: [self-hosted]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: cargo audit
        run: |
          set -euo pipefail
          if ! cargo audit --version 2>/dev/null | grep -Fx 'cargo-audit 0.22.2'; then
            cargo install --locked cargo-audit --version 0.22.2 --force
          fi

          # A runner's global git configuration may carry credentials for
          # this organisation that the public advisory database rejects, so
          # clone it anonymously and audit against the local copy.
          advisory_db="${RUNNER_TEMP:-/tmp}/rustsec-advisory-db"
          rm -rf "$advisory_db"
          GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null \
            GIT_TERMINAL_PROMPT=0 \
            git clone --quiet --depth 1 \
              https://github.com/RustSec/advisory-db.git "$advisory_db"

          cargo audit --no-fetch --db "$advisory_db" --deny warnings

  semver:
    # Compares the API with the latest release on crates.io, so it has
    # nothing to do until the first release exists. Not a required check.
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: cargo semver-checks
        run: |
          set -euo pipefail
          if ! curl -fsS -o /dev/null -A 'voicepipe-ci (github.com/TheDancingDeveloper-org/voicepipe)' \
              https://crates.io/api/v1/crates/voicepipe; then
            echo "voicepipe is not on crates.io yet; nothing to compare against."
            exit 0
          fi
          if ! cargo semver-checks --version 2>/dev/null | grep -Fx 'cargo-semver-checks 0.50.0'; then
            cargo install --locked cargo-semver-checks --version 0.50.0 --force
          fi
          cargo semver-checks check-release
