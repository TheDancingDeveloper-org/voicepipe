[package]
name = "voxcall"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "A pipeline for live, turn-taking voice calls with a language model: VAD, endpointing, barge-in, sentence-streamed speech"
keywords = ["voice", "vad", "speech", "llm", "realtime"]
categories = ["multimedia::audio"]
readme = "DESIGN.md"
# Kept free of workspace inheritance on purpose: this crate is meant to move
# to its own repository and be published as-is.

[features]
default = ["earshot"]
earshot = ["dep:earshot"]

[dependencies]
earshot = { version = "1.2", optional = true }
