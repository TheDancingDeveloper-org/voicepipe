[package]
name = "voxcall"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
description = "A pipeline for live, turn-taking voice calls with a language model: VAD, endpointing, barge-in, sentence-streamed speech"
keywords = ["voice", "vad", "speech", "llm", "realtime"]
categories = ["multimedia::audio"]
readme = "DESIGN.md"
# Kept free of workspace inheritance on purpose: this crate is meant to move
# to its own repository and be published as-is.

[features]
default = ["earshot"]
earshot = ["dep:earshot"]

[dependencies]
earshot = { version = "1.2", optional = true }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
