[package]
name = "voicepipe"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "A pipeline for live, turn-taking voice calls with a language model: VAD, endpointing, barge-in, sentence-streamed speech"
keywords = ["voice", "vad", "speech", "llm", "realtime"]
categories = ["multimedia::audio"]
readme = "README.md"
repository = "https://github.com/TheDancingDeveloper-org/voicepipe"
homepage = "https://github.com/TheDancingDeveloper-org/voicepipe"
documentation = "https://docs.rs/voicepipe"
exclude = ["/.github", "/docs"]

[features]
default = ["earshot"]
earshot = ["dep:earshot"]

[dependencies]
earshot = { version = "1.2", optional = true }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

[package.metadata.docs.rs]
all-features = true
